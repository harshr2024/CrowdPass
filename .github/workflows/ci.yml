name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  jvm-tests:
    name: JVM tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: pom.xml

      - name: Run full JVM test suite
        run: ./mvnw -B -ntp clean test

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 5

  deployment-validation:
    name: Deployment package and privacy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate offline AWS deployment package
        run: ./deploy/aws/scripts/validate-package.sh

      - name: Validate repository privacy and credentials
        run: ./scripts/ci/validate-repository-privacy.sh

  production-image:
    name: Production ARM64 image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build native Linux ARM64 image
        env:
          IMAGE_TAG: crowdpass-api:ci-${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --load \
            --tag "$IMAGE_TAG" \
            --build-arg APP_VERSION="ci-${GITHUB_SHA::12}" \
            --build-arg VCS_REVISION="$GITHUB_SHA" \
            .

      - name: Validate production image
        env:
          IMAGE_TAG: crowdpass-api:ci-${{ github.sha }}
        run: ./scripts/ci/validate-production-image.sh "$IMAGE_TAG" "$GITHUB_SHA"
