include classpath("application.conf")

# Queue URLs echo the caller's host and port (Compose published port, or a Testcontainers mapped port).
node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

# Standard queues. Waitlist order is decided in PostgreSQL before a message exists.
# ElasticMQ 1.7.1 has no message-retention attribute, so the 14-day DLQ retention of real SQS
# cannot be expressed here. That setting belongs with production SQS in a later phase.
queues {
  crowdpass-notifications {
    fifo = false
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "crowdpass-notifications-dlq"
      maxReceiveCount = 5
    }
  }
  crowdpass-notifications-dlq {
    fifo = false
    defaultVisibilityTimeout = 30 seconds
  }
}
