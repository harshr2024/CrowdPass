services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crowdpass}
      POSTGRES_USER: ${POSTGRES_USER:-crowdpass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crowdpass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - crowdpass-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Rate-limit counters only. State is deliberately ephemeral: no volume, persistence disabled.
  redis:
    image: redis:8.10.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  crowdpass-pgdata:
