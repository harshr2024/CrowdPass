services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crowdpass}
      POSTGRES_USER: ${POSTGRES_USER:-crowdpass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crowdpass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - crowdpass-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Rate-limit counters only. State is deliberately ephemeral: no volume, persistence disabled.
  redis:
    image: redis:8.10.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local SQS substitute only. The JVM image, not elasticmq-native.
  # Queue URLs follow the request host so the published port is reachable from the app.
  elasticmq:
    image: softwaremill/elasticmq:1.7.1
    ports:
      - "${ELASTICMQ_PORT:-9324}:9324"
    volumes:
      - ./docker/elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9324'"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    profiles: ["app"]
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-local}
        VCS_REVISION: ${VCS_REVISION:-unknown}
    image: crowdpass-api:local
    environment:
      SPRING_PROFILES_ACTIVE: local-container
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-crowdpass}
      DB_USERNAME: ${POSTGRES_USER:-crowdpass}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-crowdpass}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CROWDPASS_SQS_ENDPOINT: http://elasticmq:9324
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      elasticmq:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 40s

volumes:
  crowdpass-pgdata:
