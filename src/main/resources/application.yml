spring:
  application:
    name: crowdpass-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crowdpass}
    username: ${DB_USERNAME:crowdpass}
    password: ${DB_PASSWORD:crowdpass}

  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
