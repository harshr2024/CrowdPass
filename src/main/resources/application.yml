spring:
  application:
    name: crowdpass-api

  lifecycle:
    timeout-per-shutdown-phase: 30s

  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 30s

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      data-source-properties:
        # PostgreSQL JDBC driver: omit the server's DETAIL (e.g. "Key (email)=(...) already exists")
        # from exception messages and logs. The primary message and constraint name are unaffected.
        logServerErrorDetail: false

  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    deserialization:
      # Reject unsupported request fields (e.g. "role") instead of silently ignoring them.
      fail-on-unknown-properties: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      # Redis is optional abuse protection and realtime fan-out; keep waits short and fail open.
      timeout: 200ms
      connect-timeout: 1s

server:
  # Never trust X-Forwarded-* headers until trusted proxies are configured for AWS (Phase 10).
  forward-headers-strategy: none

crowdpass:
  jwt:
    # Base64-encoded, at least 256 bits. Never committed; startup fails if absent outside local dev.
    secret: ${CROWDPASS_JWT_SECRET:}
    issuer: crowdpass-api
    access-token-ttl: 60m

  rate-limit:
    # Base64-encoded, at least 256 bits; keys the HMAC of IPs and emails in Redis keys.
    secret: ${CROWDPASS_RATE_LIMIT_SECRET:}
    policies:
      login-ip:
        requests: 60
        window: 1m
      login-account:
        requests: 10
        window: 15m
      register-ip:
        requests: 60
        window: 10m
      seat-mutation:
        requests: 30
        window: 1m

  idempotency:
    # Completed records remain authoritative until cleanup physically removes them, so the
    # effective guarantee is at least this retention period.
    retention: 24h
    cleanup:
      fixed-delay: 1h
      batch-size: 1000

  realtime:
    heartbeat: 20s
    max-stream-lifetime: 10m
    max-connections-per-user: 3
    max-connections-per-instance: 1000
    redis-recovery-interval: 5s
    executor:
      core-size: 4
      max-size: 16
      queue-capacity: 1000

  # Standard SQS. Disabled unless a profile (local) or deployment turns the switches on, so a
  # process without queues does not poll. A blank endpoint uses the default AWS credential chain.
  messaging:
    sqs:
      endpoint: ${CROWDPASS_SQS_ENDPOINT:}
      region: ${CROWDPASS_SQS_REGION:us-east-1}
      queue-name: ${CROWDPASS_SQS_QUEUE:crowdpass-notifications}
      access-key-id: ${CROWDPASS_SQS_ACCESS_KEY_ID:}
      secret-access-key: ${CROWDPASS_SQS_SECRET_ACCESS_KEY:}
      api-call-timeout: 5s
      api-call-attempt-timeout: 3s
    publisher:
      enabled: false
      batch-size: 10
    consumer:
      enabled: false
      wait-time: 20s
      max-messages: 10

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
        add-additional-paths: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    redis:
      # Redis is optional for correctness (rate limiting and realtime fan-out fail open), so its
      # outage must not mark the application unhealthy. Outages remain visible in metrics/logs.
      enabled: false
