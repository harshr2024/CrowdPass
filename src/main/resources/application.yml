spring:
  application:
    name: crowdpass-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crowdpass}
    username: ${DB_USERNAME:crowdpass}
    password: ${DB_PASSWORD:crowdpass}

  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    deserialization:
      # Reject unsupported request fields (e.g. "role") instead of silently ignoring them.
      fail-on-unknown-properties: true

crowdpass:
  jwt:
    # Base64-encoded, at least 256 bits. Never committed; startup fails if absent outside local dev.
    secret: ${CROWDPASS_JWT_SECRET:}
    issuer: crowdpass-api
    access-token-ttl: 60m

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
