management:
  endpoint:
    health:
      show-details: always

crowdpass:
  jwt:
    # Local development only: generate a throwaway signing key when CROWDPASS_JWT_SECRET is unset.
    # Tokens become invalid on restart.
    ephemeral-secret-allowed: true
  rate-limit:
    # Local development only: generate a throwaway HMAC key when CROWDPASS_RATE_LIMIT_SECRET is unset.
    ephemeral-secret-allowed: true
