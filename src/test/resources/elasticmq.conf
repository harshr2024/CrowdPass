include classpath("application.conf")

# Same queues as docker/elasticmq/elasticmq.conf, with a 1-second visibility timeout so redelivery
# and dead-letter tests do not wait 30 seconds between receives. maxReceiveCount stays 5.
node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

queues {
  crowdpass-notifications {
    fifo = false
    defaultVisibilityTimeout = 1 second
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "crowdpass-notifications-dlq"
      maxReceiveCount = 5
    }
  }
  crowdpass-notifications-dlq {
    fifo = false
    defaultVisibilityTimeout = 1 second
  }
}
