crowdpass:
  jwt:
    # Each test context generates its own random signing key; no secret is committed.
    ephemeral-secret-allowed: true
  rate-limit:
    ephemeral-secret-allowed: true
    # Effectively unlimited so tests that are not about rate limiting are unaffected; rate-limit
    # tests set their own low limits.
    policies:
      login-ip:
        requests: 1000000
      login-account:
        requests: 1000000
      register-ip:
        requests: 1000000
      seat-mutation:
        requests: 1000000
  messaging:
    # Point at a closed port with dummy credentials so tests never touch AWS or the default
    # credential chain. Messaging tests override the endpoint with ElasticMQ.
    sqs:
      endpoint: http://127.0.0.1:9
      access-key-id: test
      secret-access-key: test
    publisher:
      enabled: false
    consumer:
      enabled: false
      wait-time: 0s
